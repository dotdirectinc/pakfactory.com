name: Branch name

# Enforces the branch naming standard: feat/… | feature/… | fix/… | chore/… | docs/…
# (a PROD-#### Jira key in the description is recommended, e.g. feat/PROD-1957-algolia-search).
# A docs/… branch may only change documentation (scripts/ci/docs-only.sh: *.md, docs/
# folders, .claude/, .cursor/). Docs-only merges skip the Vercel builds
# (scripts/ci/vercel-ignore-build.sh), so this keeps code from riding along unbuilt.
# The `staging` promotion branch is exempt (it PRs into main).
# The `www-new-release` rebuild trunk is exempt so the launch PR into staging can pass.
# Required status check to select on staging + main: "Validate branch name".
#
# Also runs on `push` to `staging` so this check is stamped on the staging commit
# (like `ci-success`). That lets the auto-opened `staging -> main` promotion PR
# satisfy this required check without a PAT — a PR opened by GITHUB_TOKEN doesn't
# fire `pull_request`, but it inherits the status from the staging push.

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]
        branches: [staging, main, www-new-release]
    push:
        branches: [staging]

permissions:
    contents: read

jobs:
    validate:
        name: Validate branch name
        runs-on: ubuntu-latest
        steps:
            - name: Check out (docs/ branches only)
              if: startsWith(github.head_ref, 'docs/')
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Check head branch name
              # On pull_request use the PR's source branch; on push use the pushed
              # branch (which is `staging` — exempt below).
              env:
                  BRANCH: ${{ github.head_ref || github.ref_name }}
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  # Allow the staging -> main promotion branch (and pushes to staging).
                  # Allow the www rebuild trunk so www-new-release -> staging can pass.
                  if [ "$BRANCH" = "staging" ] || [ "$BRANCH" = "www-new-release" ]; then
                    echo "OK: '$BRANCH' is an exempt long-lived branch."
                    exit 0
                  fi
                  # Require an approved prefix with a non-empty description.
                  if echo "$BRANCH" | grep -Eq '^docs/.+'; then
                    # A docs/ branch: every changed file must be documentation.
                    base="$(git merge-base "origin/$BASE_REF" HEAD)"
                    if bash scripts/ci/docs-only.sh "$base" HEAD; then
                      echo "OK: '$BRANCH' changes documentation only."
                    else
                      echo "::error::'$BRANCH' is a docs/ branch but changes more than documentation (listed above). Use feat/ fix/ or chore/ for code."
                      exit 1
                    fi
                  elif echo "$BRANCH" | grep -Eq '^(feat|feature|features|fix|bugfix|hotfix|chore)/.+'; then
                    echo "OK: '$BRANCH' matches the naming standard."
                  else
                    echo "::error::Branch '$BRANCH' must start with one of: feat/ feature/ features/ fix/ bugfix/ hotfix/ chore/ docs/ ."
                    echo "Examples: feat/PROD-1957-algolia-search , feature/blog-homepage , fix/blog-toc-card , chore/ci-branch-flow , docs/www-search"
                    exit 1
                  fi
